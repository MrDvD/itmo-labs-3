services:
  spice_lab:
    build:
      context: ..
      dockerfile: Containerfile.spice
    container_name: spice_lab
    volumes:
      - ../..:/app
      - ../../schemas:/schemas
    ports:
      - "5902:5900"
    networks:
      - electronics-1
  report:
    build:
      context: .
      dockerfile: Containerfile.report
    container_name: report
    command: sleep infinity
    depends_on:
      - spice_lab
    volumes:
      - ../..:/app
    networks:
      - electronics-1

networks:
  electronics-1: {}